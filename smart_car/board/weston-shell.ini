# Smart_car 车载系统：接管开机界面
#
# 用途：安装到 /etc/xdg/weston/weston.ini.d/06-smartcar-shell.ini
#
# 为什么要这一段：
#   1) panel-position=none —— 关掉 weston desktop-shell 自带的顶部面板。
#      不关的话，在桌面背景下从屏幕顶部下拉会拖出 weston 的时钟/启动器面板，
#      和出厂 systemui 的下拉一起抢触摸，容易把画面卡住。
#   2) background-color —— 应用起来之前显示纯色底，而不是出厂那张
#      /userdata/ui/src/iphone/.../iphone.jpg 壁纸（那张图是 720x1280 竖屏构图，
#      在旋转后的 1280x720 逻辑屏上会被拉伸，也就是"翻转压缩"的观感来源之一）。
#
# 注意：出厂主界面 /userdata/ui/systemui 与 controlcenter 由
#       /etc/init.d/S50systemui 启动，本项目用 S98smartcar 接管自启，
#       S50systemui 已被禁用（见部署记录），否则它会先画一屏再被 kill。

[shell]
panel-position=none
background-color=0xff000000

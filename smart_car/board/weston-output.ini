# Smart_car 车载系统：屏幕旋转 90°（竖屏面板 -> 1280x720 横屏）
#
# 面板：ATK-MD0550-7201280 (DSI-1)，原生 720x1280 竖屏。
# weston 的 drm 后端会在每次启动时枚举可用输出，按 name 匹配本段。
# 调试办法：
#   1) 确认连接器名： ls /sys/class/drm | grep DSI     -> card0-DSI-1
#   2) 临时改动后重启 weston： /etc/init.d/S49weston restart
#   3) 看日志： tail -50 /var/log/weston.log
# 若旋转方向不对，把 transform 依次换成 rotate-270 / rotate-180 试。

[output]
name=DSI-1
transform=rotate-90

# Smart_car 车载系统统一配置（开机自启脚本 S99appinit 会读取这个文件）
#
# 改完执行：  /etc/init.d/S99appinit restart
# 想改 WiFi： /etc/wpa_supplicant-smartcar.conf，然后 /etc/init.d/S47wifi restart

# ------------------------------------------------------------------ 定位 / 地图
# 天气城市来源优先级（天气跟着定位走）：
#   1) GPS 定位 -> 逆地理编码拿城市名（有 GPS 模块且已定到位）
#   2) 本机公网 IP 定位（没 GPS 模块 / 室内收不到星）
#   3) 下面 SMARTCAR_CITYID / SMARTCAR_CITY —— **仅当上面都失败时**才用
#   4) 再不行让天气服务端按 IP 自己猜
#
# 所以这行现在是"最后兜底"而不是"钉死"：它不会再抢在 GPS/IP 前面。
# 常用城市编码：广州 101280101  深圳 101280601  北京 101010100  上海 101020100
#               佛山 101280800  东莞 101281600  珠海 101280700  中山 101281700
export SMARTCAR_CITYID=101280101
# 也可以直接用城市名（SMARTCAR_CITYID 优先）：
# export SMARTCAR_CITY=广州

# 地图页在没有 GPS 时显示的默认坐标（"经度,纬度"），默认是广州市中心
export SMARTCAR_MAP_CENTER=113.264434,23.129162

# GPS 模块（可选）：板上没有 GPS，需要自己接
#   UART 模块：接排针 A27(UART2_RX) / A36(UART2_TX) / A2 GND / A1 5V
export SMARTCAR_GPS_PORT=/dev/ttyS2
export SMARTCAR_GPS_BAUD=9600
#   USB 模块：改成 /dev/ttyUSB0，波特率按模块说明（常见 9600 或 115200）

# ------------------------------------------------------------------ 外设（不接就保持默认，不影响启动）
# ⚠️ AMP 模式（A7=Linux + M0=传感器服务）下 DHT11 数据脚**必须是 52 = GPIO1_C4 (A25)**：
#    C3(51)/A28 被 M0 的 UART4_RX 占用（RMIO 矩阵归 M0 管，Linux 拿不回来），
#    所以接线要从 A28 挪到 A25（并保证 DATA 有 4.7k~10k 上拉到 3.3V）。
#    只有退回纯 A7 模式（不跑 M0）时才能用回 51。
export SMARTCAR_DHT11_GPIO=52          # DHT11 数据脚  A25（AMP 必须）
export SMARTCAR_SR04_TRIG_GPIO=54      # SR04 TRIG    A23（M0 所有）
export SMARTCAR_SR04_ECHO_GPIO=55      # SR04 ECHO    A24（M0 所有）
export SMARTCAR_BUZZER_GPIO=56         # 蜂鸣器信号线 A21（GPIO1_D0=gpio56）
# A21=GPIO1_D0=gpio56；AMP 下蜂鸣器由 M0 驱动，本项只在回退驱动路径生效
# 蜂鸣器触发极性：1=低电平触发（IO 低=响，IO 高=静音）← 本板模块就是这种，默认
#                0=高电平触发（IO 高=响）
#   判定：模块丝印/说明写"低电平触发"，或把 IO 接 GND 会响、接 3.3V 不响 => 用 1
#   改完执行 /etc/init.d/S99appinit restart
export SMARTCAR_BUZZER_ACTIVE_LOW=1
# 开机自检：短响一声确认接线接通（1=开，默认；0=关）
#   听到一声=接线正常；没听到=信号线没接到 A21
export SMARTCAR_BUZZER_SELFTEST=1
# 蜂鸣器只在“测到距离且 < 30cm”时响；没接超声波模块时保持静音（不会一直叫）
export SMARTCAR_LED_BRIGHTNESS=/sys/class/leds/work/brightness
export SMARTCAR_MQ135_ADC=/sys/bus/iio/devices/iio:device0/in_voltage3_raw

# ------------------------------------------------------------------ 视频目录
# 视频放 TF 卡/U 盘时，应用会自动搜索这些目录（冒号分隔）
export SMARTCAR_VIDEO_DIRS=/mnt/udisk/Videos:/mnt/sdcard/Videos:/userdata/Videos

# ------------------------------------------------------------------ 界面
# 满屏显示（设 0 则按设计比例居中，四周留边）
export SMARTCAR_FULLSCREEN=1
# 强制统一缩放百分比（默认按屏幕自动算，1280x720 时为 120）
# export SMARTCAR_UI_SCALE=120

# ------------------------------------------------------------------ 日志
export QT_LOGGING_RULES="qt.network.ssl.warning=false;qt.qpa.*=false"
